<div class="bar"><div class="wrap">
  <div class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="var(--accent)"/><path d="M13 5.5c3 4 4.6 6.3 4.6 8.6a4.6 4.6 0 0 1-9.2 0c0-2.3 1.6-4.6 4.6-8.6z" fill="var(--accent-ink)"/></svg>
      Dengue Buster
    </div>
    <div class="meta">
      <span><span class="dot"></span><span data-i18n="m.reported"></span> <b id="m-snap"></b></span>
      <span class="hide-s"><span data-i18n="m.outlook"></span> <b id="m-win"></b></span>
      <div class="seg lang" role="group" data-i18n-aria="lang.aria">
        <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ms" lang="ms" aria-pressed="false">BM</button>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs" data-i18n-aria="tabs.aria">
    <button type="button" data-tab="today" data-i18n="tab.today"></button>
    <button type="button" data-tab="map" data-i18n="tab.map"></button>
    <button type="button" data-tab="inspect" data-i18n="tab.inspect"></button>
    <button type="button" data-tab="evidence" data-i18n="tab.evidence"></button>
    <button type="button" data-tab="about" data-i18n="tab.about"></button>
  </nav>
</div></div>

<main class="wrap">

  <!-- ============ TODAY: for everyone ============ -->
  <div class="tab" id="tab-today">
    <section class="hero">
      <div class="drops" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="hero-in">
        <span class="eyebrow" id="h-eyebrow"></span>
        <h1 id="h1"></h1>
        <p class="lead" id="hsub"></p>
        <form class="find" id="find-form" autocomplete="off">
          <label for="find" data-i18n="find.label"></label>
          <div class="find-row">
            <input id="find" type="search" list="dlist" data-i18n-ph="find.ph" enterkeyhint="search">
            <button type="submit" class="btn primary" data-i18n="find.submit"></button>
            <button type="button" class="btn" id="locate" data-i18n="find.locate"></button>
          </div>
          <datalist id="dlist"></datalist>
          <p class="fine" id="find-msg" aria-live="polite"></p>
          <div class="cands" id="cands"></div>
          <p class="fine muted" data-i18n="find.privacy"></p>
        </form>
        <div id="found" aria-live="polite"></div>
      </div>
    </section>

    <section class="aud" aria-label="Choose your view">
      <button type="button" class="aud-c" data-go="find"><b data-i18n="aud.1.t"></b><span data-i18n="aud.1.d"></span></button>
      <button type="button" class="aud-c" data-go="inspect"><b data-i18n="aud.2.t"></b><span data-i18n="aud.2.d"></span></button>
      <button type="button" class="aud-c" data-go="evidence"><b data-i18n="aud.3.t"></b><span data-i18n="aud.3.d"></span></button>
    </section>

    <section>
      <div class="head"><h2 data-i18n="now.h"></h2><p data-i18n="now.p"></p></div>
      <div class="kpis" id="kpis"></div>
    </section>

    <div class="grid2 top-grid">
      <section>
        <div class="head"><h2 data-i18n="top.h"></h2><p data-i18n="top.p"></p></div>
        <div class="panel pad"><div class="rows" id="topd"></div></div>
      </section>
      <section>
        <div class="head"><h2 data-i18n="state.h"></h2>
          <div class="seg" role="group" data-i18n-aria="state.aria" id="st-metric">
            <button type="button" data-m="inc" aria-pressed="true" data-i18n="state.m.inc"></button>
            <button type="button" data-m="cum" aria-pressed="false" data-i18n="state.m.cum"></button>
          </div>
        </div>
        <div class="panel pad"><div class="rows" id="states"></div><p class="muted foot" id="st-note"></p></div>
      </section>
    </div>

    <section>
      <div class="head"><h2 data-i18n="roles.h"></h2><p data-i18n="roles.p"></p></div>
      <div class="panel scroll"><table id="roles"></table></div>
      <p class="fine muted" id="roles-note"></p>
    </section>

    <section>
      <div class="head"><h2 data-i18n="how.h"></h2></div>
      <div class="how">
        <div class="panel pad"><span class="tiers"><i class="t-Low"></i><i class="t-Moderate"></i><i class="t-High"></i><i class="t-Very"></i></span><h3 data-i18n="how.1.t"></h3><p data-i18n-html="how.1.p"></p></div>
        <div class="panel pad"><span class="big-n">217</span><h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.p"></p></div>
        <div class="panel pad"><span class="big-n">~</span><h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.p"></p></div>
      </div>
    </section>
  </div>

  <!-- ============ MAP: explore ============ -->
  <div class="tab" id="tab-map" hidden>
    <section>
      <div class="head"><h2 data-i18n="map.h"></h2><p data-i18n="map.p"></p></div>
      <div class="work">
        <div class="panel">
          <div class="controls">
            <label for="layer"><span data-i18n="map.colour"></span>
              <select id="layer"></select>
            </label>
            <div class="seg" role="group" data-i18n-aria="map.zoom.aria">
              <button type="button" id="z-all" aria-pressed="true" data-i18n="map.all"></button>
              <button type="button" id="z-pen" aria-pressed="false" data-i18n="map.pen"></button>
              <button type="button" id="z-bor" aria-pressed="false" data-i18n="map.bor"></button>
            </div>
            <label class="chk" for="ov-ob"><input type="checkbox" id="ov-ob" checked> <span data-i18n="map.ob"></span></label>
            <label class="chk" for="ov-hs"><input type="checkbox" id="ov-hs" checked> <span data-i18n="map.hs"></span></label>
          </div>
          <p class="layer-desc" id="layer-desc"></p>
          <div class="mapbox"><svg id="map" role="img" data-i18n-aria="map.aria"></svg></div>
          <div class="legend" id="legend"></div>
        </div>
        <aside class="panel side" id="side" aria-live="polite"></aside>
      </div>
    </section>
  </div>

  <!-- ============ INSPECTION: field teams ============ -->
  <div class="tab" id="tab-inspect" hidden>
    <section>
      <div class="head"><h2 data-i18n="ins.h"></h2><p data-i18n="ins.p"></p></div>
      <p class="caution" id="caution"></p>
      <div class="score-how" id="score-how"></div>
      <div class="panel">
        <div class="controls">
          <div class="seg" role="group" data-i18n-aria="ins.type.aria" id="kind">
            <button type="button" data-k="all" aria-pressed="true" data-i18n="ins.all"></button>
            <button type="button" data-k="school" aria-pressed="false" data-i18n="ins.school"></button>
            <button type="button" data-k="kindergarten" aria-pressed="false" data-i18n="ins.kg"></button>
            <button type="button" data-k="construction" aria-pressed="false" data-i18n="ins.con"></button>
          </div>
          <label for="qstate"><span data-i18n="ins.state"></span> <select id="qstate"></select></label>
          <span class="muted" id="q-note"></span>
        </div>
        <div class="scroll" style="max-height:560px;overflow-y:auto"><table id="queue"></table></div>
      </div>
    </section>
  </div>

  <!-- ============ EVIDENCE: analysts ============ -->
  <div class="tab" id="tab-evidence" hidden>
    <section>
      <div class="head"><h2 data-i18n="ev.h"></h2><p data-i18n="ev.p"></p></div>
      <div class="take" id="takeaways"></div>
      <div class="grid2">
        <div class="panel pad"><div class="card-h"><h3 data-i18n="ev.abl.t"></h3><p id="abl-sub"></p></div><div class="bars" id="abl"></div><p class="read" id="abl-read"></p></div>
        <div class="panel pad"><div class="card-h"><h3 data-i18n="ev.hz.t"></h3><p data-i18n="ev.hz.p"></p></div><div id="hz"></div><div class="lg" id="hz-lg"></div><p class="read" id="hz-read"></p></div>
        <div class="panel pad"><div class="card-h"><h3 data-i18n="ev.lag.t"></h3><p data-i18n="ev.lag.p"></p></div><div class="scroll"><table class="heat" id="lagw"></table></div><p class="read" data-i18n="ev.lag.read"></p></div>
        <div class="panel pad"><div class="card-h"><h3 data-i18n="ev.irr.t"></h3><p data-i18n="ev.irr.p"></p></div><div id="irr"></div><p class="read" data-i18n="ev.irr.read"></p></div>
      </div>
    </section>
    <section>
      <div class="head"><h2 data-i18n="ev.bt.h"></h2><p data-i18n="ev.bt.p"></p></div>
      <div class="panel pad"><div class="lg" id="bt-lg"></div><div id="bt"></div></div>
    </section>
    <section>
      <div class="head"><h2 data-i18n="ev.sp.h"></h2></div>
      <div class="panel pad" id="spatial"></div>
    </section>
    <section>
      <div class="head"><h2 data-i18n="ev.tbl.h"></h2><p data-i18n="ev.tbl.p"></p></div>
      <div class="panel scroll"><table id="regions"></table></div>
    </section>
  </div>

  <!-- ============ ABOUT: sources, method, limits ============ -->
  <div class="tab" id="tab-about" hidden>
    <section>
      <div class="head"><h2 data-i18n="ab.steps.h"></h2></div>
      <ol class="steps" id="steps"></ol>
    </section>
    <section>
      <div class="head"><h2 data-i18n="ab.gloss.h"></h2></div>
      <dl class="gloss" id="gloss"></dl>
    </section>
    <section>
      <div class="head"><h2 data-i18n="ab.lim.h"></h2><p data-i18n="ab.lim.p"></p></div>
      <div class="notes" id="notes"></div>
    </section>
    <section>
      <div class="head"><h2 data-i18n="ab.src.h"></h2><p data-i18n="ab.src.p"></p></div>
      <div class="panel scroll"><table id="sources"></table></div>
    </section>
  </div>

</main>
<footer class="wrap" id="foot"></footer>
<div class="tip" id="tip" hidden></div>
