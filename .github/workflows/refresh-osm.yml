name: Monthly OSM refresh

# Schools, kindergartens and construction sites change slowly and the public Overpass mirror is flaky, so the
# snapshot in data/reference/osm is refreshed monthly. A state that fails keeps its previous snapshot.
on:
  schedule:
    - cron: "43 2 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.ingest_osm
      - name: Commit snapshot
        run: |
          git config user.name "dengue-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference/osm
          git diff --cached --quiet || git commit -m "data: monthly OSM snapshot refresh $(date -u +%F)"
          git push
