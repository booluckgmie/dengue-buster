name: Daily dengue pipeline

# iDengue only publishes today's figures, so the case history is built by snapshotting it every day.
# Each run appends to data/feed/, rebuilds the outlook and commits the refreshed dashboard bundle.
on:
  schedule:
    # GitHub drops or delays scheduled runs (the 18 and 19 Nov 01:17 UTC slots never fired), and iDengue posts
    # the day's figures at no fixed hour. So try every three hours, on an off-peak minute. Reruns on the same
    # reporting date add nothing, and a snapshot never lowers a figure already saved for that date.
    - cron: "47 */3 * * *"   # 00:47, 03:47, ... UTC = 08:47, 11:47, ... Malaysia time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: dengue-cache-${{ github.run_id }}
          restore-keys: dengue-cache-
      - run: python -m pytest -q
      # weekly history from the WHO situation updates; a hiccup there must not stop the daily iDengue refresh
      - run: python -m pipeline.ingest_who
        continue-on-error: true
      # --osm-cached: use the committed OSM snapshot in data/reference/osm; the monthly refresh-osm workflow updates it
      - run: python -m pipeline.run --osm-cached
      - run: python -m pipeline.build_web
      - name: Commit feed and dashboard data
        run: |
          git config user.name "dengue-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed data/processed data/reference web/data web/index.html
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
