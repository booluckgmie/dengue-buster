name: Daily dengue pipeline

# iDengue only publishes today's figures, so the case history is built by snapshotting it every day.
# Each run appends to data/feed/, rebuilds the outlook and commits the refreshed dashboard bundle.
on:
  schedule:
    - cron: "17 1 * * *"   # 09:17 Malaysia time, after the daily iDengue update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: dengue-cache-${{ github.run_id }}
          restore-keys: dengue-cache-
      - run: python -m pytest -q
      # --osm-cached: use the committed OSM snapshot in data/reference/osm; the monthly refresh-osm workflow updates it
      - run: python -m pipeline.run --osm-cached
      - run: python -m pipeline.build_web
      - name: Commit feed and dashboard data
        run: |
          git config user.name "dengue-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed data/processed data/reference web/data web/index.html
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git push
